<html lang="pl">
<head>

<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../assets/voucher.css">

  @font-face { font-family: "M4Y Cormorant"; font-weight: 500; font-style: normal; src: url(../assets/fonts/cormorant-garamond-500-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC; }

  :root {

<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Massage 4 You · Poznań</div>
      <h1>Bon podarunkowy</h1>
    </div>
  </header>

  <div class="layout">
    <form id="form" autocomplete="off" onsubmit="return false">
      <div class="field">
        <label for="number">Numer bonu</label>
        <div class="num-row">
          <input id="number" required>
          <button type="button" class="ghost" id="nextNumber" title="Następny wolny numer">Nowy</button>
        </div>
      </div>
      <div class="field">
        <label for="name">Imię i nazwisko osoby obdarowanej</label>
        <input id="name" placeholder="np. Anna Kowalska" required>
      </div>
      <div class="field">
        <label for="itemSelect" id="itemLabel">Zabieg lub kwota</label>
        <select id="itemSelect"></select>
        <input id="item" placeholder="Wpisz nazwę zabiegu" hidden>
      </div>
      <div class="row2">
        <div class="field">
          <label for="issued">Data zakupu</label>
          <input id="issued" type="date">
        </div>
        <div class="field">
          <label for="valid">Ważny do</label>
          <input id="valid" type="date">
        </div>
      </div>
      <p class="hint" id="validHint"></p>
    </form>

    <section class="preview" aria-label="Podgląd bonu">
      <div class="canvas-frame"><canvas id="voucher" width="2400" height="1500"></canvas></div>

      <div class="actions">
        <button class="btn" type="button" id="download">Pobierz JPEG</button>
        <button class="btn secondary" type="button" id="share">Wyślij klientowi</button>
      </div>

      <div class="send-box" id="sendBox" hidden>
        <h2>Wyślij bon</h2>
        <p class="hint">Na tym urządzeniu nie da się dołączyć pliku automatycznie. Bon został pobrany i skopiowany do schowka - otwórz wiadomość poniżej i wklej obraz (Ctrl+V) albo dołącz pobrany plik.</p>
        <div class="field">
          <label for="email">E-mail klienta (opcjonalnie)</label>
          <input id="email" type="email" placeholder="klient@example.com">
        </div>
        <div class="actions" style="margin-top:0">
          <button class="btn" type="button" id="mailBtn">Otwórz e-mail</button>
          <button class="btn secondary" type="button" id="waBtn">Otwórz WhatsApp</button>
          <button class="btn secondary" type="button" id="copyText">Kopiuj treść wiadomości</button>
        </div>
      </div>

      <details class="history">
        <summary>Ostatnio wystawione bony na tym urządzeniu</summary>
        <table><thead><tr><th>Nr</th><th>Osoba</th><th>Zabieg</th><th>Ważny do</th></tr></thead><tbody id="historyBody"></tbody></table>
      </details>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/voucher.js"></script>
<script>

  items: {

      "Masaż tkanek głębokich - 60 min",
      "Masaż tkanek głębokich - 80 min",

      "Masaż sportowy - 60 min",
      "Masaż sportowy - 80 min",

    "Masaże dla dwojga": [
      "Masaż dla dwojga relaksacyjny - 60 min",

      "Masaż dla dwojga relaksacyjny ciała + twarzy - 90 min",
      "Masaż dla dwojga relaksacyjny ciała + twarzy - 120 min",
      "Masaż dla dwojga relaksacyjny ciała + twarzy - 140 min",
      "Masaż dla dwojga kamieniami gorącymi - 60 min",
      "Masaż dla dwojga kamieniami gorącymi - 80 min",
      "Masaż Kobido dla dwojga - 60 min",
      "Masaż Kobido dla dwojga - 75 min"
    ],
    "Masaże twarzy": [
      "Masaż Kobido - 60 min",

      "Masaż mioplastyczny + transbukalny twarzy - 60 min",
      "Masaż transbukalny twarzy - 40 min",

    ],
    "Masaże tajskie": [

      "Masaż tajski klasyczny na matach - 90 min",
      "Masaż tajski stóp - 45 min",

    ],
    "Masaże antycellulitowe": [

      "Masaż antycellulitowy + presoterapia - 80 min"
    ],
    "Zabiegi na ciało": [
      "Endosfera - 20 min",
      "Endosfera - 30 min",
      "Endosfera - 45 min",
      "Endosfera - pakiet 6 zabiegów",
      "Endosfera - pakiet 10 zabiegów",
      "Presoterapia - 30 min",
      "Presoterapia - pakiet 10 zabiegów",
      "Lipolaser - 20 min",
      "Lipolaser - 40 min",
      "Lipolaser - pakiet 6 zabiegów",
      "Lipolaser - pakiet 10 zabiegów",
      "Liposukcja ultradźwiękowa - 30 min",
      "Liposukcja ultradźwiękowa - pakiet 6 zabiegów",
      "Liposukcja ultradźwiękowa - pakiet 10 zabiegów",
      "Kriolipoliza - 60 min",
      "Fala radiowa z vacuum - 30 min",
      "Fala radiowa z vacuum - 60 min",
      "Fala radiowa z vacuum - pakiet 6 zabiegów po 30 min",
      "Fala radiowa z vacuum - pakiet 6 zabiegów po 60 min",
      "Fala radiowa z vacuum - pakiet 10 zabiegów po 30 min",
      "Fala radiowa z vacuum - pakiet 10 zabiegów po 60 min",
      "Endermologia (LPG) - 30 min",
      "Endermologia (LPG) - 60 min",
      "Endermologia (LPG) - pakiet 6 zabiegów",
      "Endermologia (LPG) - pakiet 10 zabiegów"
    ],
    "Kwoty": [
      "170 zł",
      "240 zł",
      "320 zł"
    ]
  },
  fileSlug: "massage-4-you",
  site: "massage-4-you.com",
  phone: "+48 533 681 901",
  address: "ul. Zeylanda 3/1, 60-808 Poznań",
  message: (v) =>
    `Dzień dobry,\n\nw załączniku przesyłamy voucher upominkowy Massage 4 You nr ${v.number} dla ${v.name}` +
    (v.item ? ` (${v.item})` : "") +
    `.\nVoucher jest ważny do ${v.validText}. Termin można zarezerwować pod numerem +48 533 681 901 albo przez stronę massage-4-you.com.\n\nDziękujemy i pozdrawiamy,\nZespół Massage 4 You`,
  subject: (v) => `Voucher upominkowy Massage 4 You nr ${v.number}`,
  fonts: [
    '500 40px "M4Y Cormorant"', '600 40px "M4Y Cormorant"', 'italic 400 40px "M4Y Cormorant"',
    '300 40px "M4Y Jost"', '400 40px "M4Y Jost"'
  ],

  // logo mark, recoloured to the card's cream
  async prepare({ assets, loadImage }) {
    const mark = await loadImage("../assets/brands/massage-4-you-logo-mark.png");
    const off = document.createElement("canvas"); off.width = mark.width; off.height = mark.height;
    const o = off.getContext("2d");
    o.drawImage(mark, 0, 0); o.globalCompositeOperation = "source-in";
    o.fillStyle = "#F6F3EC"; o.fillRect(0, 0, off.width, off.height);
    assets.mark = off;
  },

  /* Forest-green card, matches the site's .voucher-card */
  draw(v, { ctx, W, H, spaced, fit, wrapFit, diagonalGradient, assets }) {
    const b = this;
    const CREAM = "#F6F3EC", soft = "rgba(246,243,236,0.72)", GOLD = "#D2A46C";
    const SERIF = (s, w = 500, st = "") => `${st} ${w} ${s}px "M4Y Cormorant", Georgia, serif`;
    const SANS = (s, w = 400) => `${w} ${s}px "M4Y Jost", system-ui, sans-serif`;
    const P = 150;

    ctx.fillStyle = diagonalGradient(135, [[0, "#2A251E"], [1, "#3E5A46"]]);
    ctx.fillRect(0, 0, W, H);

    if (assets.mark) {
      const mw = 1250, mh = mw * assets.mark.height / assets.mark.width;
      ctx.save(); ctx.globalAlpha = 0.08; ctx.drawImage(assets.mark, W - mw + 160, H - mh + 200, mw, mh); ctx.restore();
    }

    // wordmark "MASSAGE 4 YOU" with the heavier 4, as on the site
    ctx.textBaseline = "alphabetic"; ctx.fillStyle = CREAM;
    const sp = 58 * 0.2; let x = P;
    ctx.font = SERIF(58, 500); x += spaced("MASSAGE ", x, 250, sp) + sp;
    ctx.font = SANS(52, 400); x += spaced("4", x, 250, sp) + sp;
    ctx.font = SERIF(58, 500); spaced(" YOU", x, 250, sp);
    ctx.fillStyle = soft; ctx.font = SANS(26, 300);
    spaced("HEALTHY & RELAX", P, 305, 26 * 0.28);
    ctx.font = SANS(30, 400);
    spaced("VOUCHER UPOMINKOWY", W - P, 245, 30 * 0.2, "right");

    ctx.fillStyle = GOLD; ctx.font = SANS(28, 400);
    spaced("DLA", P, 560, 28 * 0.26);
    const name = v.name || "Imię i nazwisko";
    ctx.fillStyle = v.name ? CREAM : "rgba(246,243,236,0.35)";
    const ns = fit(name, (s) => SERIF(s, 500), 160, 76, W - 2 * P);
    ctx.font = SERIF(ns, 500); ctx.fillText(name, P, 560 + 30 + ns * 0.95);

    let y = 560 + 30 + ns * 0.95 + 150;
    if (v.item) {
      ctx.fillStyle = GOLD; ctx.font = SANS(28, 400);
      spaced(/^\d[\d\s]*(zł|pln)$/i.test(v.item) ? "KWOTA" : "ZABIEG", P, y, 28 * 0.26);
      const hasDigits = /\d/.test(v.item);
      const itemFont = hasDigits ? (s) => SANS(Math.round(s * 0.8), 300) : (s) => SERIF(s, 400, "italic");
      const w = wrapFit(v.item, itemFont, 76, 44, W - 2 * P - 300, 2);
      ctx.fillStyle = CREAM; ctx.font = itemFont(w.size);
      w.lines.forEach((l, i) => ctx.fillText(l, P, y + 30 + w.size * 1.0 + i * w.size * 1.15));
    }

    const ry = 1160;
    ctx.fillStyle = "rgba(246,243,236,0.22)"; ctx.fillRect(P, ry, W - 2 * P, 2);
    [["NUMER VOUCHERA", v.number || "-"], ["WAŻNY DO", v.validText || "-"]].forEach(([label, val], i) => {
      const cx = P + i * 560;
      ctx.fillStyle = GOLD; ctx.font = SANS(25, 400); spaced(label, cx, ry + 90, 25 * 0.24);
      // canvas cannot switch Cormorant to lining figures, so numbers are set in Jost
      ctx.fillStyle = CREAM; ctx.font = SANS(50, 300); ctx.fillText(val, cx, ry + 162);
    });

    ctx.textAlign = "right"; ctx.font = SANS(30, 300);
    ctx.fillStyle = CREAM; ctx.fillText(b.address, W - P, ry + 100);
    ctx.fillStyle = soft; ctx.fillText(`${b.phone}  ·  ${b.site}`, W - P, ry + 150);
    ctx.textAlign = "left";

    ctx.fillStyle = "rgba(246,243,236,0.45)"; ctx.font = SANS(23, 300);
    ctx.fillText("Voucher imienny, nie podlega wymianie na gotówkę. Rezerwacja terminu telefonicznie lub przez stronę.", P, H - 70);
  }
});

</body>
</html>
